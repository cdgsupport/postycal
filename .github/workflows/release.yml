name: Release

# Cut a release by tagging: `git tag v2.2.0 && git push origin v2.2.0`.
# The build refuses to publish if the tag and the plugin's declared version
# disagree, or if anything fails to lint.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a release from (e.g. v2.2.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve tag and version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "TAG=$TAG"          >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}"  >> "$GITHUB_ENV"

      - name: Lint PHP
        run: |
          php -v
          find . -name '*.php' -not -path './.git/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Lint JavaScript
        run: node --check admin/js/admin.js

      - name: Build the plugin zip
        run: |
          chmod +x bin/build-release.sh
          bin/build-release.sh "$TAG"

      - name: Extract release notes from the changelog
        run: |
          chmod +x bin/changelog.sh
          bin/changelog.sh "$VERSION" > release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "dist/postycal-${VERSION}.zip" \
            --title "PostyCal $VERSION" \
            --notes-file release-notes.md \
            --verify-tag
